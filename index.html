<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c52227">
<title>Trực nhật ATTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: white page in ATTS brand red; one narrow column app, tab bar on top, cards per task; calendar grids scroll inside their own box */
:root{
  --bg:#ffffff; --surface:#ffffff; --tint:#f7f4f4; --line:#e6dfdf; --fg:#1d1a1a; --muted:#6b6262;
  --accent:#c52227; --accent-soft:#fbe6e6; --on-accent:#ffffff;
  --warn:#9a5a00; --warn-soft:#fdf0d9; --bad:#7a1418; --bad-soft:#f3d6d7; --ok:#1d7a4a; --ok-soft:#e0f2e7;
  --f-display:"Lexend",system-ui,sans-serif; --f-body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(5px + env(safe-area-inset-top,0px));background:var(--accent);z-index:10}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block}
header{border-bottom:2px solid var(--accent);padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.place{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.today{color:var(--muted);font-size:14px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto}
nav button{flex:1;min-width:max-content;border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:9px 12px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
button{font-family:var(--f-body)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:600}
.section{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.alert{border-color:var(--warn)}
.card.danger{border-color:var(--bad)}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tname{font-weight:700;font-size:16px}
.freq{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.who{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.15;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.muted{background:transparent;border:1px solid var(--line);color:var(--muted)}
.queue{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;align-self:flex-start}
.note{font-size:13px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pager{display:flex;align-items:center;gap:6px}
.pager b{min-width:150px;text-align:center;font-family:var(--f-display);font-weight:600}
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--tint)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:728px}
.cal .dh{padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--tint);border-bottom:1px solid var(--line)}
.cal .cell{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;font-size:12px}
.cal .cell:nth-child(7n){border-right:0}
.cal .cell.out{opacity:.4}
.cal .cell.off{background:var(--tint)}
.cal .cell.now{box-shadow:inset 0 0 0 2px var(--accent)}
.dnum{font-weight:700;font-size:13px}
.ent{border-radius:5px;padding:2px 5px;background:var(--accent-soft);color:var(--fg);line-height:1.3;word-break:break-word}
.ent.done{background:var(--ok-soft)} .ent.miss{background:var(--warn-soft)} .ent.fine{background:var(--bad-soft)}
.ent small{color:var(--muted);display:block;font-size:10px}
.period{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number],select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
input[type=text]{flex:1 1 160px}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1 1 140px;min-width:0;font-weight:600;word-break:break-word}
.icon{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:14px}
.icon.del{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.dayview .li .grow small{display:block;font-weight:400;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
html,body{margin:0}
body{font-size:15px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.modal{position:fixed;inset:0;background:rgba(29,26,26,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.sheet{background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.pin{font:600 28px var(--f-display);letter-spacing:.5em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;color:var(--fg);background:var(--surface)}
.err{color:var(--accent);font-size:13px;min-height:1em}
</style>
</head>

// ---------- dates ----------
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d||1,12)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return fmt(d)};

const monday=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const isOff=k=>(cfg.offDays||[]).includes(parse(k).getDay());
const validDay=k=>{let g=0;while(isOff(k)&&g++<7)k=addDays(k,1);return k};
const keyOf=(f,dk)=>f==="day"?dk:f==="week"?monday(dk):dk.slice(0,7);
const curKey=f=>keyOf(f,todayKey());
function nextKey(f,k){
  if(f==="day") return validDay(addDays(k,1));
  if(f==="week") return addDays(k,7);
  let[y,m]=k.split("-").map(Number); m++; if(m>12){m=1;y++} return `${y}-${pad(m)}`;
}
const dShort=k=>{const d=parse(k);return `${WD[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
function keyLabel(f,k){
  if(f==="day") return dShort(k);
  if(f==="week") return `tuần ${pad(parse(k).getDate())}/${pad(parse(k).getMonth()+1)}`;
  const[y,m]=k.split("-"); return `tháng ${Number(m)}/${y}`;
}
const money=n=>(Number(n)||0).toLocaleString("vi-VN")+"đ";

// ---------- members / rotation ----------
const M=()=>cfg.members||[];
const memberById=id=>M().find(m=>m.id===id);
const nameOf=(id,fallback)=>memberById(id)?.name||fallback||"(đã xoá)";
function idxOf(id){const i=M().findIndex(m=>m.id===id);return i<0?0:i}
function nextMember(id){const n=M().length;if(!n)return null;return M()[(idxOf(id)+1)%n].id}
function memberAt(id,k){const n=M().length;if(!n)return null;return M()[(idxOf(id)+k)%n]}
const sortedTasks=()=>Object.values(tasks).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));

// ---------- catch-up: missed periods -> reminder -> fine ----------
function catchUp(t){
  const n={...t}; const out=[]; const ck=curKey(n.freq); let g=0;
  if(n.freq==="day"){const v=validDay(n.dueKey); if(v!==n.dueKey) n.dueKey=v;}
  while(n.dueKey<ck && g++<90){
    const mem=memberById(n.curId)||M()[0];
    if(mem){
      n.curId=mem.id; n.miss=(n.miss||0)+1;
      const base={taskId:t.id,taskName:t.name,freq:t.freq,memberId:mem.id,memberName:mem.name,key:n.dueKey,at:Date.now()};
      out.push({id:`miss_${t.id}_${n.dueKey}`,...base,type:"miss",n:n.miss});
      if(n.miss>(cfg.reminders??2)){
        out.push({id:`fine_${t.id}_${n.dueKey}`,...base,type:"fine",amount:cfg.fine??50000,paid:false});
        n.miss=0; n.curId=nextMember(mem.id);
      }
    }
    n.dueKey=nextKey(n.freq,n.dueKey);
  }
  if(n.dueKey<ck) n.dueKey=n.freq==="day"?validDay(ck):ck;
  const changed=n.dueKey!==t.dueKey||n.curId!==t.curId||(n.miss||0)!==(t.miss||0);
  return {n,out,changed};
}
async function runCatchUp(){
  if(!db||!unlocked||busy||!ready.cfg||!ready.tasks) return;
  const work=sortedTasks().map(catchUp).filter(r=>r.changed||r.out.length);
  lastRunDay=todayKey();
  if(!work.length) return;
  busy=true;
  try{
    const have=new Set(logs.map(l=>l.id));
    const lease=await db.doc("meta/lock").acquire({holder:"v"+Math.random().toString(36).slice(2),ttlMs:20000});
    if(!lease.acquired) return;
    for(const {n,out} of work){
      for(const l of out){if(have.has(l.id))continue;const {id,...body}=l; await db.doc("logs/"+id).set(body);}
      const {id,...tb}=n; await db.doc("tasks/"+id).set(tb);
    }
  }catch(e){console.warn(e)} finally{busy=false}
}

// ---------- actions ----------
async function markDone(tid){
  const t=tasks[tid]; if(!t||!M().length) return;
  if(t.dueKey>curKey(t.freq)) return;
  const mem=memberById(t.curId)||M()[0];
  try{
    await db.doc(`logs/done_${t.id}_${t.dueKey}`).set({taskId:t.id,taskName:t.name,freq:t.freq,memberId:mem.id,memberName:mem.name,key:t.dueKey,type:"done",prevMiss:t.miss||0,at:Date.now()});
    const {id,...tb}=t;
    await db.doc("tasks/"+t.id).set({...tb,curId:nextMember(mem.id),miss:0,dueKey:nextKey(t.freq,t.dueKey)});
    toast(`Đã ghi nhận ${mem.name} làm xong "${t.name}". Lượt sau: ${nameOf(nextMember(mem.id))}.`);
  }catch(e){fail(e)}
}
async function undoDone(tid){
  const t=tasks[tid]; const l=lastDone(tid); if(!t||!l) return;
  try{
    const {id,...tb}=t;
    await db.doc("tasks/"+t.id).set({...tb,curId:l.memberId,dueKey:l.key,miss:l.prevMiss||0});
    await db.doc("logs/"+l.id).delete();
    toast("Đã hoàn tác.");
  }catch(e){fail(e)}
}
function lastDone(tid){
  const t=tasks[tid]; if(!t) return null;
  const l=logs.filter(x=>x.taskId===tid&&x.type==="done").sort((a,b)=>b.at-a.at)[0];
  if(!l) return null;
  return nextKey(t.freq,l.key)===t.dueKey&&t.curId===nextMember(l.memberId)?l:null;
}
async function saveCfg(patch){
  cfg={...cfg,...patch}; render();
  try{await db.doc("config/main").set(cfg)}catch(e){fail(e)}
}
function fail(e){console.warn(e);if(e?.code==="permission-denied")toast("Việc này cần mật khẩu quản lý hoặc mã PIN đã đổi.");else toast("Chưa lưu được, kiểm tra mạng rồi thử lại.")}
// ---------- PIN (nhân viên) + mật khẩu quản lý ----------
let pinResolve=null, pinLevel="staff";
function ensureUnlocked(level="staff"){
  if(level==="admin"?admin:(unlocked||admin)) return Promise.resolve(true);

  document.getElementById("pinTitle").textContent=level==="admin"?"Nhập mật khẩu quản lý":"Nhập mã PIN văn phòng";

  document.getElementById("pinModal").hidden=false;

function closePin(ok){document.getElementById("pinModal").hidden=true;if(pinResolve){pinResolve(ok);pinResolve=null}}
document.getElementById("pinCancel").addEventListener("click",()=>{closePin(false);render()});
document.getElementById("fPin").addEventListener("submit",async e=>{
  e.preventDefault(); e.stopPropagation();
  const pin=document.getElementById("pinInput").value.trim(); if(!pin) return;
  try{
    if(pinLevel==="admin"){await fs.doc("admins/"+uid).set({pin,at:Date.now()});admin=true;toast("Đã mở khoá quyền quản lý trên máy này.")}
    else{await fs.doc("unlocks/"+uid).set({pin,at:Date.now()});toast("Đã mở khoá máy này.")}

  }catch(err){document.getElementById("pinErr").textContent=err?.code==="permission-denied"?(pinLevel==="admin"?"Mật khẩu quản lý không đúng.":"Mã PIN không đúng. Thử lại."):"Không kiểm tra được, kiểm tra mạng."}
});
async function lockAdmin(){
  try{await fs.doc("admins/"+uid).delete()}catch(e){console.warn(e)}
  admin=false; try{unlocked=(await fs.doc("unlocks/"+uid).get()).exists}catch(_){unlocked=false}
  toast("Đã khoá quyền quản lý trên máy này."); render();
}
let tt; function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,3200)}

// ---------- assignment for any period ----------
function assign(t,key){
  const ls=logs.filter(l=>l.taskId===t.id&&l.key===key);
  const pick=ls.find(l=>l.type==="done")||ls.find(l=>l.type==="fine")||ls.find(l=>l.type==="miss");
  if(key<t.dueKey) return pick?{name:pick.memberName||nameOf(pick.memberId),status:pick.type,log:pick}:null;
  if(!M().length) return null;
  let k=0,c=t.dueKey,g=0; while(c<key&&g++<500){c=nextKey(t.freq,c);k++}
  if(c!==key) return null;
  const m=memberAt(t.curId,k);
  return {name:m?.name,status:key===t.dueKey?(t.miss?"late":"due"):"future",miss:t.miss||0};
}
function missStreak(t){
  return logs.filter(l=>l.taskId===t.id&&l.type==="miss"&&l.memberId===t.curId).sort((a,b)=>b.at-a.at).slice(0,t.miss||0).map(l=>l.key);
}
// ---------- render ----------
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view=()=>document.getElementById("view");
function render(){
  const d=new Date();
  document.getElementById("todayLabel").textContent=`${["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"][d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ({home:renderHome,cal:renderCal,stats:renderStats,setup:renderSetup})[tab]();
}
function noMembersBox(){return `<div class="empty">Chưa có nhân viên trong danh sách trực. <br><button class="btn small" data-go="setup" style="margin-top:10px">Thêm nhân viên</button></div>`}

function renderHome(){
  const ts=sortedTasks();
  if(!ready.tasks){view().innerHTML=`<div class="empty">Đang tải lịch trực...</div>`;return}
  if(!ts.length){view().innerHTML=`<div class="empty">Chưa có việc nào. Vào Cài đặt để thêm việc như đổ rác, tưới cây.</div>`;return}
  const late=ts.filter(t=>t.miss>0&&M().length);
  let h="";
  if(!M().length) h+=noMembersBox();
  if(late.length){
    h+=`<div class="banner"><b>Cần nhắc:</b> `+late.map(t=>`${esc(nameOf(t.curId))} chưa làm "${esc(t.name)}" (nhắc lần ${t.miss}/${cfg.reminders})`).join("; ")+`. Quên thêm ${cfg.reminders-Math.max(...late.map(t=>t.miss))+1} lần nữa sẽ bị phạt ${money(cfg.fine)}.</div>`;
  }
  const groups=[["day","Việc hôm nay"],["week","Việc tuần này"],["month","Việc tháng này"]];
  for(const[f,label] of groups){
    const g=ts.filter(t=>t.freq===f); if(!g.length) continue;
    h+=`<section class="section"><h2>${label}</h2><div class="grid">`+g.map(card).join("")+`</div></section>`;
  }
  const recent=[...logs].sort((a,b)=>b.at-a.at).slice(0,8);
  if(recent.length){
    h+=`<section class="section"><h2>Ghi nhận gần đây</h2><div class="card"><div class="list">`+recent.map(l=>`<div class="li"><span class="grow">${esc(l.memberName||nameOf(l.memberId))} <span class="note">· ${esc(l.taskName)} · ${keyLabel(l.freq,l.key)}</span></span>${statusChip(l.type,l.n,l.amount)}</div>`).join("")+`</div></div></section>`;
  }
  view().innerHTML=`<div class="section" style="gap:22px">${h}</div>`;
}
function statusChip(type,n,amount){
  if(type==="done") return `<span class="chip ok">Đã làm</span>`;
  if(type==="miss") return `<span class="chip warn">Quên · nhắc lần ${n||1}</span>`;
  if(type==="fine") return `<span class="chip bad">Phạt ${money(amount)}</span>`;
  return "";
}
function card(t){
  const ck=curKey(t.freq), has=M().length>0;
  const mem=memberById(t.curId)||M()[0];
  const notYet=t.dueKey>ck;
  let chip="", cls="card";
  if(!has) chip=`<span class="chip muted">Chưa có người</span>`;
  else if(notYet) chip=`<span class="chip muted">Ngày nghỉ · lượt kế: ${keyLabel(t.freq,t.dueKey)}</span>`;
  else if(t.miss){
    const left=cfg.reminders-t.miss+1;
    chip=`<span class="chip ${t.miss>=cfg.reminders?"bad":"warn"}">Nhắc lần ${t.miss}/${cfg.reminders}</span>`;
    cls+=t.miss>=cfg.reminders?" danger":" alert";
  } else chip=`<span class="chip">${t.freq==="day"?"Hôm nay":t.freq==="week"?"Tuần này":"Tháng này"}</span>`;
  const queue=has?Array.from({length:Math.min(4,M().length-1)},(_,i)=>memberAt(mem.id,i+1)?.name).filter(Boolean):[];
  const streak=t.miss?missStreak(t):[];
  const undo=lastDone(t.id);
  return `<article class="${cls}">
    <div class="thead"><div><div class="tname">${esc(t.name)}</div><div class="freq">${FREQ[t.freq]}</div></div>${chip}</div>
    <div class="who">${has?esc(mem.name):"—"}</div>
    ${t.miss&&streak.length?`<div class="note">Đã quên: ${streak.map(k=>keyLabel(t.freq,k)).join(", ")}. ${t.miss>=cfg.reminders?`Quên thêm lần nữa sẽ phạt ${money(cfg.fine)}.`:"Việc được dời sang hôm nay."}</div>`:""}
    ${canWrite&&has?`<button class="btn" data-done="${t.id}" ${notYet?"disabled":""}>Đã làm xong</button>`:""}
    ${queue.length?`<div class="queue">Tiếp theo: ${queue.map(n=>`<span class="chip muted">${esc(n)}</span>`).join("")}</div>`:""}
    ${undo&&canWrite&&(admin||Date.now()-undo.at<600000)?`<button class="link" data-undo="${t.id}">Bấm nhầm? Hoàn tác lượt của ${esc(undo.memberName)}</button>`:""}
  </article>`;
}

function renderCal(){
  if(!calRef) calRef=todayKey();
  const ts=sortedTasks();
  let title="", body="";
  const dayEntries=(dk)=>ts.filter(t=>t.freq==="day").map(t=>{
    if(isOff(dk)) return "";
    const a=assign(t,dk); if(!a) return "";
    const cls=a.status==="done"?"done":a.status==="fine"?"fine":a.status==="miss"||a.status==="late"?"miss":"";
    return `<div class="ent ${cls}"><small>${esc(t.name)}</small>${esc(a.name)}</div>`;
  }).join("");
  const periodBox=(f,key)=>ts.filter(t=>t.freq===f).map(t=>{const a=assign(t,key);return `<span class="chip ${a?.status==="done"?"ok":a?.status==="fine"?"bad":a?.status==="miss"||a?.status==="late"?"warn":"muted"}">${esc(t.name)}: ${esc(a?.name||"—")}</span>`}).join("");
  if(calMode==="day"){
    title=dShort(calRef)+"/"+parse(calRef).getFullYear();
    const rows=ts.map(t=>{
      const key=keyOf(t.freq,calRef);
      if(t.freq==="day"&&isOff(calRef)) return `<div class="li"><span class="grow">${esc(t.name)}<small>${FREQ[t.freq]}</small></span><span class="chip muted">Ngày nghỉ</span></div>`;
      const a=assign(t,key);
      const st=!a?`<span class="chip muted">Chưa có lịch</span>`:a.status==="done"?statusChip("done"):a.status==="fine"?statusChip("fine",0,a.log.amount):a.status==="miss"?statusChip("miss",a.log.n):a.status==="late"?`<span class="chip warn">Đang trễ</span>`:a.status==="due"?`<span class="chip">Đến lượt</span>`:`<span class="chip muted">Dự kiến</span>`;
      return `<div class="li"><span class="grow">${esc(a?.name||"—")}<small>${esc(t.name)} · ${FREQ[t.freq]}</small></span>${st}</div>`;
    }).join("");
    body=`<div class="card dayview"><div class="list">${rows||'<div class="note">Chưa có việc.</div>'}</div></div>`;
  } else if(calMode==="week"){
    const mon=monday(calRef); const end=addDays(mon,6);
    title=`${pad(parse(mon).getDate())}/${pad(parse(mon).getMonth()+1)} – ${pad(parse(end).getDate())}/${pad(parse(end).getMonth()+1)}`;
    let g=""; for(let i=0;i<7;i++){const dk=addDays(mon,i);g+=`<div class="dh">${dShort(dk)}</div>`}
    for(let i=0;i<7;i++){const dk=addDays(mon,i);g+=`<div class="cell ${isOff(dk)?"off":""} ${dk===todayKey()?"now":""}">${dayEntries(dk)}</div>`}
    const wk=periodBox("week",mon), mk=periodBox("month",mon.slice(0,7));
    body=`${wk||mk?`<div class="period">${wk}${mk}</div>`:""}<div class="scroll"><div class="cal">${g}</div></div>`;
  } else {
    const first=calRef.slice(0,7)+"-01"; const start=monday(first);
    const [y,m]=calRef.split("-").map(Number); title=`Tháng ${m}/${y}`;
    let g=["T2","T3","T4","T5","T6","T7","CN"].map(w=>`<div class="dh">${w}</div>`).join("");
    let dk=start;
    for(let i=0;i<42;i++){
      const inM=dk.slice(0,7)===first.slice(0,7);
      if(i>=35&&!inM&&parse(dk).getDay()===1) break;
      const wkTasks=parse(dk).getDay()===1?ts.filter(t=>t.freq==="week").map(t=>{const a=assign(t,dk);return a?`<div class="ent ${a.status==="done"?"done":a.status==="fine"?"fine":a.status==="miss"||a.status==="late"?"miss":""}"><small>${esc(t.name)} (cả tuần)</small>${esc(a.name)}</div>`:""}).join(""):"";
      g+=`<div class="cell ${inM?"":"out"} ${isOff(dk)?"off":""} ${dk===todayKey()?"now":""}"><span class="dnum">${parse(dk).getDate()}</span>${wkTasks}${dayEntries(dk)}</div>`;
      dk=addDays(dk,1);
    }
    const mk=periodBox("month",calRef.slice(0,7));
    body=`${mk?`<div class="period">${mk}</div>`:""}<div class="scroll"><div class="cal">${g}</div></div>`;
  }
  view().innerHTML=`<div class="section">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Kiểu lịch">${[["day","Ngày"],["week","Tuần"],["month","Tháng"]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${calMode===k}">${l}</button>`).join("")}</div>
      <div class="pager"><button class="icon" data-nav="-1" aria-label="Trước">‹</button><b>${title}</b><button class="icon" data-nav="1" aria-label="Sau">›</button><button class="btn ghost small" data-nav="0">Hôm nay</button></div>
    </div>
    ${!M().length?noMembersBox():""}
    ${body}
    <div class="legend"><span class="chip ok">Đã làm</span><span class="chip warn">Quên / đang trễ</span><span class="chip bad">Bị phạt</span><span class="chip">Đến lượt / dự kiến</span></div>
    <div class="note">Lịch tương lai dự kiến theo thứ tự xoay vòng, giả định mọi người làm đúng hạn. Ai quên thì lịch phía sau lùi theo.</div>
  </div>`;
}

  const inP=l=>{const mk=l.key.slice(0,7);return statPeriod==="all"||(statPeriod==="this"?mk===now:mk===prev)};
  const L=logs.filter(inP);
  const ids=new Set([...M().map(m=>m.id),...L.map(l=>l.memberId)]);
  const rows=[...ids].map(id=>{
    const ls=L.filter(l=>l.memberId===id);
    const fines=ls.filter(l=>l.type==="fine");
    return {id,name:ls[0]?.memberName&&!memberById(id)?ls[0].memberName+" (đã xoá)":nameOf(id),
      done:ls.filter(l=>l.type==="done").length, miss:ls.filter(l=>l.type==="miss").length,
      fines:fines.length, total:fines.reduce((s,l)=>s+(l.amount||0),0), unpaid:fines.filter(l=>!l.paid).reduce((s,l)=>s+(l.amount||0),0)};
  }).sort((a,b)=>b.done-a.done||a.miss-b.miss);
  const maxDone=Math.max(1,...rows.map(r=>r.done));
  const tot=rows.reduce((s,r)=>({done:s.done+r.done,miss:s.miss+r.miss,total:s.total+r.total,unpaid:s.unpaid+r.unpaid}),{done:0,miss:0,total:0,unpaid:0});
  const fineList=L.filter(l=>l.type==="fine").sort((a,b)=>b.at-a.at);
  view().innerHTML=`<div class="section" style="gap:18px">
    <div class="toolbar"><h2>Thống kê theo nhân viên</h2>
      <div class="seg" role="group" aria-label="Khoảng thời gian">${[["this","Tháng này"],["prev","Tháng trước"],["all","Tất cả"]].map(([k,l])=>`<button data-period="${k}" aria-pressed="${statPeriod===k}">${l}</button>`).join("")}</div></div>
    <div class="note">Tổng: ${tot.done} lượt làm, ${tot.miss} lần quên, quỹ phạt ${money(tot.total)} (chưa nộp ${money(tot.unpaid)}).</div>
    ${rows.length?`<div class="scroll"><table>
      <thead><tr><th>Nhân viên</th><th class="num">Đã làm</th><th></th><th class="num">Quên</th><th class="num">Bị phạt</th><th class="num">Tổng phạt</th><th class="num">Chưa nộp</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="num">${r.done}</td><td style="width:22%"><div class="bar"><i style="width:${r.done/maxDone*100}%"></i></div></td><td class="num">${r.miss?`<span class="chip warn">${r.miss}</span>`:0}</td><td class="num">${r.fines}</td><td class="num">${money(r.total)}</td><td class="num">${r.unpaid?`<span class="chip bad">${money(r.unpaid)}</span>`:"0đ"}</td></tr>`).join("")}</tbody>
    </table></div>`:noMembersBox()}
    <section class="section"><h2>Danh sách phạt</h2>
      ${fineList.length?`<div class="card"><div class="list">${fineList.map(l=>`<div class="li"><span class="grow">${esc(l.memberName||nameOf(l.memberId))} <span class="note">· ${esc(l.taskName)} · ${keyLabel(l.freq,l.key)}</span></span><span class="chip ${l.paid?"ok":"bad"}">${l.paid?"Đã nộp":"Chưa nộp"} ${money(l.amount)}</span>${admin?`<button class="btn ghost small" data-paid="${l.id}">${l.paid?"Bỏ đánh dấu":"Đánh dấu đã nộp"}</button>`:""}</div>`).join("")}</div></div>`:`<div class="empty">Chưa có ai bị phạt trong khoảng này.</div>`}
    </section>
  </div>`;
}

function renderSetup(){
  if(!admin){view().innerHTML=`<div class="empty" style="display:flex;flex-direction:column;gap:12px;align-items:center"><h2>Cài đặt đã khoá</h2><div>Chỉ người quản lý được thêm, xoá nhân viên, đổi lượt và sửa quy định phạt.</div><button class="btn" data-adminlogin="1">Nhập mật khẩu quản lý</button></div>`;return}
  const ts=sortedTasks(); const dis=canWrite?"":"disabled";
  view().innerHTML=`<div class="section" style="gap:18px">
    <section class="card"><h2>Nhân viên trực (theo thứ tự xoay vòng)</h2>
      <div class="list">${M().map((m,i)=>`<div class="li"><span class="grow">${i+1}. ${esc(m.name)}</span>
        <button class="icon" data-mv="${m.id}" data-d="-1" aria-label="Lên" ${dis}>↑</button><button class="icon" data-mv="${m.id}" data-d="1" aria-label="Xuống" ${dis}>↓</button>
        <button class="icon del" data-rm="${m.id}" aria-label="Xoá ${esc(m.name)}" ${dis}>✕</button></div>`).join("")||'<div class="note">Chưa có ai. Thêm tên bên dưới.</div>'}</div>
      <form id="fMem" class="row"><input type="text" id="memName" placeholder="Tên nhân viên, ví dụ: Minh" ${dis}><button class="btn small" ${dis}>Thêm</button></form>
      <div class="note">Có thể dán nhiều tên, cách nhau bằng dấu phẩy.</div>
    </section>
    <section class="card"><h2>Công việc</h2>
      <div class="list">${ts.map(t=>`<div class="li"><span class="grow">${esc(t.name)} <span class="note">· ${FREQ[t.freq]}</span></span>
        <label class="note" for="cur_${t.id}">Đang tới lượt</label>
        <select id="cur_${t.id}" data-cur="${t.id}" ${dis}>${M().map(m=>`<option value="${m.id}" ${m.id===(t.curId||M()[0]?.id)?"selected":""}>${esc(m.name)}</option>`).join("")}</select>
        <button class="icon del" data-rmt="${t.id}" aria-label="Xoá việc ${esc(t.name)}" ${dis}>✕</button></div>`).join("")||'<div class="note">Chưa có việc.</div>'}</div>
      <form id="fTask" class="row"><input type="text" id="taskName" placeholder="Tên việc, ví dụ: Lau bàn họp" ${dis}>
        <select id="taskFreq" ${dis}><option value="day">Hằng ngày</option><option value="week">Hằng tuần</option><option value="month">Hằng tháng</option></select>
        <button class="btn small" ${dis}>Thêm việc</button></form>
    </section>
    <section class="card"><h2>Quy định</h2>
      <div class="row"><label for="cReminders">Số lần nhắc trước khi phạt</label><input type="number" id="cReminders" min="0" max="10" value="${cfg.reminders}" style="width:80px" ${dis}></div>
      <div class="row"><label for="cFine">Tiền phạt mỗi lần (đồng)</label><input type="number" id="cFine" min="0" step="10000" value="${cfg.fine}" style="width:130px" ${dis}></div>
      <div class="row"><span>Ngày nghỉ (không tính việc hằng ngày):</span>
        ${[6,0].map(d=>`<label><input type="checkbox" data-off="${d}" ${cfg.offDays.includes(d)?"checked":""} ${dis}> ${d===6?"Thứ bảy":"Chủ nhật"}</label>`).join("")}</div>
      <div class="note">Cách tính: quên lần 1 → nhắc lần 1, việc dời sang hôm sau, vẫn người đó làm. Quên lần ${cfg.reminders} → nhắc lần ${cfg.reminders}. Quên lần ${cfg.reminders+1} → phạt ${money(cfg.fine)} và chuyển lượt cho người tiếp theo. Làm đúng → chuyển ngay người tiếp theo.</div>
    </section>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost small" data-lockadmin="1">Khoá cài đặt trên máy này</button></div>
  </div>`;
}

// ---------- events ----------
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  if(b.dataset.go){tab=b.dataset.go;render();return}
  if(b.dataset.adminlogin){if(await ensureUnlocked("admin"))render();return}
  if(b.dataset.lockadmin){await lockAdmin();return}
  if(b.dataset.paid||b.dataset.mv||b.dataset.rm||b.dataset.rmt){if(!(await ensureUnlocked("admin")))return}
  if(b.dataset.done||b.dataset.undo){if(!(await ensureUnlocked()))return}
  if(b.dataset.done){b.disabled=true;await markDone(b.dataset.done);return}
  if(b.dataset.undo){await undoDone(b.dataset.undo);return}
  if(b.dataset.mode){calMode=b.dataset.mode;render();return}
  if(b.dataset.nav!==undefined){
    const n=Number(b.dataset.nav); if(!calRef) calRef=todayKey();
    if(n===0) calRef=todayKey();
    else if(calMode==="day") calRef=addDays(calRef,n);
    else if(calMode==="week") calRef=addDays(calRef,7*n);
    else {let[y,m]=calRef.split("-").map(Number);m+=n;if(m>12){m=1;y++}if(m<1){m=12;y--}calRef=`${y}-${pad(m)}-01`}
    render();return;
  }
  if(b.dataset.period){statPeriod=b.dataset.period;render();return}
  if(b.dataset.paid){const l=logs.find(x=>x.id===b.dataset.paid);if(l){try{await db.doc("logs/"+l.id).update({paid:!l.paid})}catch(err){fail(err)}}return}
  if(b.dataset.mv){
    const a=[...M()];const i=a.findIndex(m=>m.id===b.dataset.mv);const j=i+Number(b.dataset.d);
    if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; await saveCfg({members:a});return;
  }
  if(b.dataset.rm){
    const m=memberById(b.dataset.rm);
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Xoá?";b.style.width="auto";b.style.padding="0 8px";return}
    const nxt=nextMember(m.id); const rest=M().filter(x=>x.id!==m.id);
    for(const t of sortedTasks()) if(t.curId===m.id){const {id,...tb}=t;try{await db.doc("tasks/"+id).set({...tb,curId:rest.length?nxt:null,miss:0})}catch(err){fail(err)}}
    await saveCfg({members:rest});toast(`Đã xoá ${m.name} khỏi danh sách trực.`);return;
  }
  if(b.dataset.rmt){
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Xoá?";b.style.width="auto";b.style.padding="0 8px";return}
    try{await db.doc("tasks/"+b.dataset.rmt).delete();toast("Đã xoá việc.")}catch(err){fail(err)}return;
  }
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(!(el.dataset.cur||el.id==="cReminders"||el.id==="cFine"||el.dataset.off!==undefined)) return;
  if(!(await ensureUnlocked("admin"))){render();return}
  if(el.dataset.cur){const t=tasks[el.dataset.cur];const {id,...tb}=t;try{await db.doc("tasks/"+id).set({...tb,curId:el.value,miss:0});toast("Đã đổi người đang tới lượt.")}catch(err){fail(err)}}
  if(el.id==="cReminders") saveCfg({reminders:Math.max(0,Math.min(10,Number(el.value)||0))});
  if(el.id==="cFine") saveCfg({fine:Math.max(0,Number(el.value)||0)});
  if(el.dataset.off!==undefined){const d=Number(el.dataset.off);const s=new Set(cfg.offDays);el.checked?s.add(d):s.delete(d);saveCfg({offDays:[...s]})}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id!=="fMem"&&e.target.id!=="fTask") return;
  if(!(await ensureUnlocked("admin"))) return;
  if(e.target.id==="fMem"){
    const v=document.getElementById("memName").value; const names=v.split(",").map(s=>s.trim()).filter(Boolean);
    if(!names.length) return;
    const add=names.map(n=>({id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n}));
    const wasEmpty=!M().length;
    await saveCfg({members:[...M(),...add]});
    if(wasEmpty) for(const t of sortedTasks()){const {id,...tb}=t;try{await db.doc("tasks/"+id).set({...tb,curId:add[0].id,miss:0,dueKey:t.freq==="day"?validDay(curKey("day")):curKey(t.freq)})}catch(err){fail(err)}}
    toast(`Đã thêm ${names.join(", ")}.`);
  }
  if(e.target.id==="fTask"){
    const name=document.getElementById("taskName").value.trim(); const freq=document.getElementById("taskFreq").value;
    if(!name) return;
    const id="t"+Date.now().toString(36);
    try{await db.doc("tasks/"+id).set({name,freq,order:Object.keys(tasks).length+1,curId:M()[0]?.id||null,miss:0,dueKey:freq==="day"?validDay(curKey("day")):curKey(freq)});toast(`Đã thêm việc "${name}".`)}catch(err){fail(err)}
  }
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();if(lastRunDay!==todayKey())runCatchUp()}});
setInterval(()=>{if(lastRunDay&&lastRunDay!==todayKey()){render();runCatchUp()}},60000);

  "file":"Anh đang mở file trực tiếp trên máy (file://). Hãy mở bằng link GitHub Pages dạng https://ten-github.github.io/truc-nhat-atts/",
  "config":"Chưa dán cấu hình Firebase vào index.html (vẫn còn DAN_API_KEY_VAO_DAY). Làm lại Bước 3.",
  "auth/api-key-not-valid":"apiKey không đúng. Copy lại nguyên khối firebaseConfig ở Bước 3.",
  "auth/invalid-api-key":"apiKey không đúng. Copy lại nguyên khối firebaseConfig ở Bước 3.",
  "auth/admin-restricted-operation":"Chưa bật đăng nhập ẩn danh. Authentication → Sign-in method → Anonymous → Enable → Save.",
  "auth/operation-not-allowed":"Chưa bật đăng nhập ẩn danh. Authentication → Sign-in method → Anonymous → Enable → Save.",

  "failed-precondition":"Chưa tạo Firestore Database. Vào Firestore → Create database (Bước 2)."
};
function showErr(e){
  const code=e?.code||e?.message||"unknown";
  const el=document.getElementById("offline");
  el.innerHTML="<b>Không kết nối được dữ liệu.</b> "+esc(HINTS[code]||"Gửi mã lỗi này cho người cài đặt app.")+"<br><span class='note'>Mã lỗi: "+esc(code)+"</span>";
  el.hidden=false;
}
render();
function wrap(x){return {id:x.id,exists:x.exists,data:()=>x.data(),metadata:x.metadata}}
function makeDb(){
  const D=p=>{const r=fs.doc(p);return {
    set:d=>r.set(d), update:d=>r.update(d), delete:()=>r.delete(),
    onSnapshot:(n,er)=>r.onSnapshot(x=>n(wrap(x)),er),
    acquire:({holder,ttlMs})=>fs.runTransaction(async tx=>{const x=await tx.get(r);const now=Date.now();
      if(x.exists&&x.data().exp>now&&x.data().holder!==holder) return {acquired:false};
      tx.set(r,{holder,exp:now+(ttlMs||20000)}); return {acquired:true}})}};
  const Q=q=>({orderBy:(f,d)=>Q(q.orderBy(f,d)),limit:n=>Q(q.limit(n)),
    onSnapshot:(n,er)=>q.onSnapshot(x=>n({docs:x.docs.map(wrap),metadata:x.metadata}),er)});
  return {doc:D,collection:p=>Q(fs.collection(p))};
}
(async()=>{
  try{
    if(location.protocol==="file:") throw {code:"file"};
    if(!firebaseConfig.apiKey||firebaseConfig.apiKey.includes("DAN_API_KEY")) throw {code:"config"};
    firebase.initializeApp(firebaseConfig);
    fs=firebase.firestore();
    const cred=await new Promise((res,rej)=>{const off=firebase.auth().onAuthStateChanged(u=>{if(u){off();res(u)}},rej);if(!firebase.auth().currentUser)firebase.auth().signInAnonymously().catch(rej)});
    uid=cred.uid; db=makeDb();
    try{const u=await fs.doc("unlocks/"+uid).get();unlocked=u.exists}catch(_){unlocked=false}
    try{const a=await fs.doc("admins/"+uid).get();admin=a.exists}catch(_){admin=false}
    if(admin) unlocked=true;
    document.getElementById("ro").hidden=unlocked;
  }catch(e){console.warn(e);showErr(e);ready={cfg:true,tasks:true,logs:true};render();return}
  const maybeRun=()=>{if(ready.cfg&&ready.tasks&&ready.logs&&lastRunDay!==todayKey()) runCatchUp()};
  db.doc("config/main").onSnapshot(s=>{cfg={...DEFAULT_CFG,...(s.exists?s.data():{})};cfg.offDays=[...(cfg.offDays||[])];ready.cfg=true;render();if(!s.metadata.fromCache)maybeRun()},e=>{console.warn(e);showErr(e)});
  db.collection("tasks").onSnapshot(s=>{tasks={};s.docs.forEach(d=>tasks[d.id]={id:d.id,...d.data()});ready.tasks=true;render();if(!s.metadata.fromCache)maybeRun()},e=>{console.warn(e);showErr(e);ready.tasks=true;render()});
  db.collection("logs").orderBy("at","desc").limit(1000).onSnapshot(s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));ready.logs=true;render();if(!s.metadata.fromCache)maybeRun()},e=>console.warn(e));
})();
})();
